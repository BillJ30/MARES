# Companies to track and how far back each run looks.
# This list is based on the Nasdaq-100 (GOOG left out: same company as GOOGL), Nov 2026.
# EA (taken private) and WBD (split into two companies) were removed: 98 companies.
# Quote any ticker YAML could misread as true/false or a number, e.g. "ON", "NO", "YES".
# The index is reshuffled every December, so review this list once a year.
#
# Optional per-company fields:
#   cik:        SEC company number. Looked up automatically if missing.
#   news_query: custom Google News search text (default: "<name> <ticker> stock").
#   feeds:      extra RSS feeds, for example a company's investor-relations feed.

settings:
  lookback_days: 3        # each run re-checks this many days; duplicates are skipped
  retention_days: 60      # older rows are deleted to stay inside free database limits
  # SEC filings are checked for every company on every run.
  # News feeds rotate: each run checks this many companies, so with 100 companies
  # and batches of 25 every company's news is refreshed about once an hour.
  news_batch_size: 50
  # Duplicate grouping (step 2): headlines about the same company count as one story
  # when their similarity is at least cluster_threshold (0 to 1) and they were
  # published within cluster_window_hours of each other. Tune with:
  #   python -m newshub.cluster --recluster-days 3 --threshold 0.8
  cluster_threshold: 0.78
  cluster_window_hours: 48
  # 6-K, 20-F and 40-F are the forms used by foreign companies (ASML, AstraZeneca, Shopify...).
  sec_forms: ["8-K", "8-K/A", "10-Q", "10-K", "6-K", "20-F", "40-F"]

# Feed templates applied to every company. {query} and {ticker} are filled in.
# If a feed stops working, the run logs the error and carries on.
rss_templates:
  - name: Google News
    url: "https://news.google.com/rss/search?q={query}&hl=en-US&gl=US&ceid=US:en"
  - name: Yahoo Finance
    url: "https://feeds.finance.yahoo.com/rss/2.0/headline?s={ticker}&region=US&lang=en-US"

